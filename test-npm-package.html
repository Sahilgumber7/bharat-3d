<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>@bharat3d/state-maps — npm package test</title>
<style>
  html, body { margin: 0; height: 100%; background: #0E1535; overflow: hidden; }
  #map { width: 100%; height: 100%; }
  #back {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    display: none;
    padding: 8px 14px; border-radius: 8px; border: none;
    background: rgba(255,255,255,0.12); color: #fff; font: 14px system-ui, sans-serif;
    cursor: pointer; backdrop-filter: blur(6px);
  }
  #back:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
  <button id="back">&larr; Back to India</button>
  <div id="map"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.160.0",
      "@bharat3d/state-maps": "https://esm.sh/@bharat3d/state-maps@0.1.0",
      "@bharat3d/state-maps/": "https://esm.sh/@bharat3d/state-maps@0.1.0/"
    }
  }
  </script>

  <script type="module">
    import { createIndiaMap, createStateMap } from '@bharat3d/state-maps';
    import { STATES, loadStateData } from '@bharat3d/state-maps/data';

    const backBtn = document.getElementById('back');
    let current = null;

    async function showIndia() {
      backBtn.style.display = 'none';
      current?.destroy();
      current = await createIndiaMap({
        container: '#map',
        registry: STATES,
        load: loadStateData,
        palette: 'midnight',
        onSelect: showState,
      });
    }

    async function showState(slug) {
      backBtn.style.display = 'block';
      current?.destroy();
      current = await createStateMap({
        container: '#map',
        state: slug,
        load: loadStateData,
        palette: 'midnight',
        view: 'isometric',
      });
    }

    backBtn.addEventListener('click', showIndia);

    await showIndia();
    globalThis.map = () => current;
  </script>
</body>
</html>

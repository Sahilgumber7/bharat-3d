<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>India in Motion — a 3D logistics network</title>
<meta name="description" content="An interactive 3D view of a nationwide logistics network: live-style parcel flows, hub throughput and a festive-season surge. All data is synthetic.">
<meta name="theme-color" content="#05070a">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="stage" aria-hidden="true"></div>
<div id="labels"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <b>India in Motion</b>
      <small>A 3D logistics network</small>
    </div>
    <span class="pill">Synthetic data</span>
  </div>
  <div class="top-right">
    <button id="tourBtn" class="ghost"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>Guided tour</button>
    <div class="tabs" id="tabs" role="tablist" aria-label="Metric"></div>
  </div>
</header>

<section class="kpis" id="kpis" aria-label="National summary"></section>

<aside class="detail" id="detail" aria-live="polite" hidden></aside>

<section class="tour" id="tour" hidden aria-live="polite">
  <div class="tour-step"><span id="tourN">01</span><i></i><span id="tourT">06</span></div>
  <h2 id="tourTitle"></h2>
  <p id="tourBody"></p>
  <div class="tour-bar"><div id="tourProg"></div></div>
  <div class="tour-btns">
    <button id="tourPrev" class="ghost sm" aria-label="Previous step">←</button>
    <button id="tourNext" class="ghost sm" aria-label="Next step">→</button>
    <button id="tourExit" class="ghost sm">Exit tour</button>
  </div>
</section>

<section class="timeline" id="timeline" aria-label="Month timeline">
  <button id="play" class="play" aria-label="Play the year"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path id="playIcon" d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></button>
  <div class="chart-wrap">
    <div class="chart-head"><span id="monthName">Oct</span><span class="chip" id="peakChip">Festive peak</span><span class="mut" id="chartCap">National volume</span></div>
    <div class="chart" id="chart" role="slider" tabindex="0" aria-label="Month" aria-valuemin="0" aria-valuemax="11" aria-valuenow="9">
      <svg viewBox="0 0 1000 64" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5ef2e6" stop-opacity=".38"/><stop offset="1" stop-color="#5ef2e6" stop-opacity="0"/></linearGradient></defs>
        <path id="area" fill="url(#g)"/><path id="line" fill="none" stroke="#5ef2e6" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="cursor" id="cursor"></div>
    </div>
    <div class="months" id="months"></div>
  </div>
</section>

<div class="tip" id="tip" role="status"></div>

<div id="intro" aria-hidden="true">
  <div class="intro-inner">
    <div class="intro-kicker">36 states · 785 districts · one network</div>
    <h1>India<br><em>in Motion</em></h1>
  </div>
  <button id="skip" class="ghost sm" tabindex="-1">Skip intro</button>
</div>
<div id="loader"><div class="ring"></div><span>Building the country…</span></div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#aaa;font-family:system-ui">This interactive map needs JavaScript and WebGL.</p></noscript>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>

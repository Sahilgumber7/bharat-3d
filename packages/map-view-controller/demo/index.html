<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MapViewController — demo (placeholder state)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0E1535; }
  body {
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #dfe4f5;
  }
  /* The toolbar is absolutely positioned, so its host must be positioned too.
     The controller sets this automatically, but being explicit is clearer. */
  #stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .hud {
    position: absolute; top: 16px; left: 16px; max-width: 320px;
    padding: 12px 14px; border-radius: 12px;
    background: rgba(14,21,53,.72); border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(10px); pointer-events: none;
  }
  .hud h1 { margin: 0 0 4px; font-size: 14px; letter-spacing: .2px; }
  .hud p { margin: 0; font-size: 12px; color: rgba(223,228,245,.66); }
  .hud .active { margin-top: 8px; font-size: 12px; }
  .hud .active b { color: #E8A820; }
</style>
</head>
<body>
<div id="stage">
  <div class="hud">
    <h1>MapViewController</h1>
    <p>Placeholder state — a procedural 6-district extruded polygon. No real geography, no per-state camera tuning: every preset is derived from the bounding box below.</p>
    <div class="active">View: <b id="activeView">—</b></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { MapViewController } from '../src/index.js';

/* ------------------------------------------------------------------ *
 * Scene boilerplate
 * ------------------------------------------------------------------ */
const stage = document.getElementById('stage');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
// Required for the cross-section view's clipping plane.
renderer.localClippingEnabled = true;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1535);
scene.fog = new THREE.Fog(0x0e1535, 700, 2600);

const camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.5, 4000);

scene.add(new THREE.HemisphereLight(0xbfd0ff, 0x1a1030, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 0.75);
key.position.set(120, 220, 90);
scene.add(key);

const grid = new THREE.GridHelper(600, 24, 0x2a3566, 0x1b2350);
grid.material.transparent = true;
grid.material.opacity = 0.5;
scene.add(grid);

/* ------------------------------------------------------------------ *
 * Placeholder state geometry — 6 wedge "districts" of an irregular disc.
 * Deliberately fictional: nothing here is real geographic data.
 * ------------------------------------------------------------------ */
const DISTRICT_COUNT = 6;
const BASE_RADIUS = 110;
const districtsGroup = new THREE.Group();
scene.add(districtsGroup);

// A stable pseudo-random wobble so the outline looks state-like, not circular.
const wobble = (a) => 1 + 0.22 * Math.sin(a * 3 + 0.7) + 0.12 * Math.cos(a * 5 - 1.4);

const districts = [];
for (let i = 0; i < DISTRICT_COUNT; i++) {
  const a0 = (i / DISTRICT_COUNT) * Math.PI * 2;
  const a1 = ((i + 1) / DISTRICT_COUNT) * Math.PI * 2;

  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  const STEPS = 12;
  for (let s = 0; s <= STEPS; s++) {
    const a = a0 + ((a1 - a0) * s) / STEPS;
    const r = BASE_RADIUS * wobble(a);
    shape.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  shape.lineTo(0, 0);

  // Varying extrusion depth stands in for whatever metric a real state map bars.
  const depth = 12 + i * 6;
  const geom = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
  // Shape is authored in XY; rotate so the map lies on the XZ ground plane (Y-up).
  geom.rotateX(-Math.PI / 2);

  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.58 + i * 0.035, 0.45, 0.42 + i * 0.03),
    roughness: 0.72,
    metalness: 0.05,
    // DoubleSide keeps the clipped interior readable in cross-section view;
    // without it the cut face renders as a hole.
    side: THREE.DoubleSide,
  });

  const mesh = new THREE.Mesh(geom, mat);
  mesh.name = `District ${i + 1}`;
  districtsGroup.add(mesh);
  districts.push({ name: mesh.name, mesh });
}

/* ------------------------------------------------------------------ *
 * stateConfig — the only thing that changes per state.
 * ------------------------------------------------------------------ */
const box = new THREE.Box3().setFromObject(districtsGroup);

const stateConfig = {
  name: 'Placeholder State',
  bounds: { min: box.min, max: box.max },
  centroid: box.getCenter(new THREE.Vector3()),
  districts,
  explode: { factor: 0.5 },
  // Per-state overrides are optional. Example of what an archipelago state
  // would use is in the README; the placeholder needs none.
  viewOverrides: {},
};

/* ------------------------------------------------------------------ *
 * The component under test
 * ------------------------------------------------------------------ */
const activeLabel = document.getElementById('activeView');

const mvc = new MapViewController(scene, camera, stateConfig, {
  renderer,
  theme: { accent: '#E8A820', accentContrast: '#0E1535' },
  position: 'bottom-right',
  duration: 700,
  initialView: 'isometric',
  onViewChange: (id) => { activeLabel.textContent = id; },
});

// Keyboard shortcuts 1–6, handy while verifying each preset.
addEventListener('keydown', (e) => {
  const i = Number(e.key) - 1;
  if (i >= 0 && i < mvc.viewIds.length) mvc.setView(mvc.viewIds[i]);
});

/* ------------------------------------------------------------------ *
 * Render loop + resize (owned by the host app, not the controller)
 * ------------------------------------------------------------------ */
addEventListener('resize', () => {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  mvc.refresh(); // re-fit the active preset to the new aspect ratio
});

(function tick() {
  requestAnimationFrame(tick);
  renderer.render(scene, camera);
})();

// Exposed for poking at in the console while testing.
window.mvc = mvc;
</script>
</body>
</html>

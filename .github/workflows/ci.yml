name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/map-view-controller
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  outline-is-current:
    # The committed national outline is generated from the state data. If a
    # boundary refresh lands without re-running the build, this catches it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/map-view-controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:overview
      - run: git diff --exit-code -- data/india-outline.js
